# Render blueprint for the back end ｜ 后端的 Render 部署配置
services:
  - type: web
    name: pausebeforebuy-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OPENROUTER_API_KEY
        sync: false          # entered by hand in the dashboard, never committed ｜ 在控制台手动填写，绝不提交到代码库
      - key: ALLOWED_ORIGINS
        value: "*"           # replace with your GitHub Pages origin ｜ 改成你的 GitHub Pages 地址
