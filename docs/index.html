<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PauseBeforeBuy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root {
  --mist: #ECEEF3;
  --paper: #FAFAFC;
  --ink: #232838;
  --muted: #5D6376;
  --line: #D5D8E2;
  --dusk: #54468A;
  --dusk-soft: #E6E2F3;
  --dusk-deep: #54468A;
  --glow: #E3A33A;
  --glow-soft: #FBEFD9;
  --danger-text: #8A3B2E;
  --font-display: "Bricolage Grotesque", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --mist: #15151D;
    --paper: #1E1E29;
    --ink: #ECEAF3;
    --muted: #A8A5B8;
    --line: #34344A;
    --dusk: #AC9DEB;
    --dusk-soft: #2C2745;
    --dusk-deep: #3B3272;
    --glow: #F0B955;
    --glow-soft: #3A2F1B;
    --danger-text: #F0A99A;
  }
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--mist);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
a { color: var(--dusk); }
:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; border-radius: 4px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- header ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  max-width: 1120px; margin: 0 auto; padding: 1.1rem 1.25rem;
}
.brand { display: flex; align-items: center; gap: .6rem; text-decoration: none; color: var(--ink); }
.brand-mark {
  width: 34px; height: 34px; border-radius: 50%; background: var(--dusk);
  display: grid; place-items: center;
}
.brand-mark span { display: flex; gap: 5px; }
.brand-mark i { display: block; width: 4px; height: 13px; border-radius: 2px; background: var(--glow); }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; letter-spacing: -.01em; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--paper); }
.lang button {
  border: 0; background: transparent; padding: .3rem .85rem; border-radius: 999px; cursor: pointer; font-size: .9rem;
}
.lang button[aria-pressed="true"] { background: var(--dusk); color: var(--paper); }

main { max-width: 1120px; margin: 0 auto; padding: 0 1.25rem 4rem; }

/* ---------- form view ---------- */
.hero { max-width: 640px; padding: 2.5rem 0 1.75rem; }
.hero h1 {
  font-family: var(--font-display); font-weight: 700; letter-spacing: -.02em;
  font-size: clamp(2.2rem, 7vw, 3.6rem); line-height: 1.02; margin: 0 0 1rem;
}
.hero p { margin: 0; color: var(--muted); font-size: 1.15rem; max-width: 34em; }

.sheet {
  max-width: 640px; background: var(--paper); border: 1px solid var(--line);
  border-radius: 22px; padding: 1.5rem 1.35rem 1.6rem;
}
.progress { display: flex; align-items: center; gap: .75rem; margin-bottom: 1.25rem; color: var(--muted); font-size: .95rem; }
.progress-track { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.progress-track span { display: block; height: 100%; width: 50%; background: var(--dusk); transition: width .35s ease; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.row > * { min-width: 0; }
legend { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: -.01em; margin-bottom: 1.1rem; padding: 0; }
.field { margin-bottom: 1.1rem; }
.field label, .field .label { display: block; font-weight: 700; margin-bottom: .3rem; }
.hint { display: block; color: var(--muted); font-size: .92rem; font-weight: 400; margin-top: -.1rem; margin-bottom: .35rem; }
.input-wrap { display: flex; align-items: stretch; border: 1.5px solid var(--line); border-radius: 12px; background: var(--mist); overflow: hidden; }
.input-wrap:focus-within { border-color: var(--dusk); }
.input-wrap .affix { display: grid; place-items: center; padding: 0 .8rem; color: var(--muted); font-size: .95rem; white-space: nowrap; }
.input-wrap input { flex: 1; min-width: 0; border: 0; background: transparent; padding: .7rem .8rem; font-size: 1.1rem; }
.input-wrap input:focus { outline: none; }
.input-wrap.invalid { border-color: var(--danger-text); }
.error { color: var(--danger-text); font-size: .92rem; margin-top: .3rem; }
.row { display: grid; gap: 0 1rem; }
@media (min-width: 560px) { .row.two { grid-template-columns: 1fr 1fr; } }

.fee-choices { display: grid; gap: .5rem; }
.field .choice {
  display: flex; font-weight: 400; margin: 0; gap: .75rem; align-items: flex-start; padding: .75rem .9rem;
  border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; background: var(--mist);
}
.field .choice input { margin-top: .35rem; accent-color: var(--dusk); }
.choice:has(input:checked) { border-color: var(--dusk); background: var(--dusk-soft); }
.choice strong { display: block; }
.choice small { color: var(--muted); font-size: .9rem; }

details.advanced { margin: .5rem 0 1.1rem; border-top: 1px solid var(--line); padding-top: .8rem; }
details.advanced summary { cursor: pointer; color: var(--dusk); font-weight: 700; }
details.advanced[open] summary { margin-bottom: .9rem; }

.privacy { color: var(--muted); font-size: .92rem; margin: .25rem 0 1.25rem; }
.privacy button { background: none; border: 0; padding: 0; color: var(--dusk); text-decoration: underline; cursor: pointer; font-size: inherit; }

.actions { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }
.btn {
  border: 0; border-radius: 999px; padding: .8rem 1.4rem; font-weight: 700; cursor: pointer; font-size: 1.02rem;
}
.btn-primary { background: var(--dusk); color: var(--paper); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-quiet { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.link-btn { background: none; border: 0; color: var(--dusk); text-decoration: underline; cursor: pointer; padding: .4rem 0; font-size: .98rem; }

/* ---------- pause overlay ---------- */
.pause {
  position: fixed; inset: 0; z-index: 50; display: none;
  background: var(--mist); padding: env(safe-area-inset-top, 0px) 1.5rem env(safe-area-inset-bottom, 0px);
  flex-direction: column; align-items: center; justify-content: center; text-align: center;
}
.pause.show { display: flex; }
.breath {
  width: min(56vw, 240px); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, var(--glow) 0%, var(--glow) 38%, var(--glow-soft) 70%);
  animation: breathe 5s ease-in-out infinite;
  margin-bottom: 2.25rem;
}
@keyframes breathe {
  0%, 100% { transform: scale(.72); opacity: .75; }
  50% { transform: scale(1); opacity: 1; }
}
.pause h2 { font-family: var(--font-display); font-weight: 500; font-size: clamp(1.5rem, 5vw, 2.1rem); line-height: 1.2; margin: 0 0 .6rem; max-width: 18em; }
.pause p { color: var(--muted); margin: 0 0 2rem; min-height: 1.6em; }
@media (prefers-reduced-motion: reduce) {
  .breath { animation: none; transform: scale(.9); }
  .progress-track span { transition: none; }
}

/* ---------- results ---------- */
.results-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .75rem; padding: 1.25rem 0 .5rem; }
.banner {
  background: var(--glow-soft); border: 1px solid var(--glow); color: var(--ink);
  border-radius: 12px; padding: .75rem 1rem; font-size: .95rem; margin: .5rem 0 1rem;
}
.headline {
  font-family: var(--font-display); font-weight: 500; letter-spacing: -.01em;
  font-size: clamp(1.45rem, 3.6vw, 2.15rem); line-height: 1.25; margin: .75rem 0 .75rem; max-width: 30em;
}
.baseline { color: var(--muted); margin: 0 0 2rem; }

.reveal {
  display: grid; gap: 0; border-radius: 22px; overflow: hidden; margin-bottom: 2.5rem;
  border: 1px solid var(--line);
}
@media (min-width: 720px) { .reveal { grid-template-columns: 1fr 1fr; } }
.reveal-side { padding: 1.5rem 1.4rem; }
.reveal-side.seen { background: var(--paper); }
.reveal-side.real { background: var(--dusk-deep); color: #FAFAFC; }
.reveal-side .cap { font-size: .98rem; margin: 0 0 .4rem; opacity: .85; }
.reveal-side .big { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.6rem, 9vw, 4.4rem); line-height: 1; letter-spacing: -.03em; margin: 0 0 .4rem; }
.reveal-side.real .big { color: var(--glow); }
.reveal-side .unit { font-size: 1rem; margin: 0; }
.reveal-foot { grid-column: 1 / -1; background: var(--glow-soft); padding: 1rem 1.4rem; margin: 0; }

.section-title { font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; letter-spacing: -.01em; margin: 0 0 1rem; }

.compare {
  display: grid; background: var(--paper); border: 1px solid var(--line); border-radius: 22px; margin-bottom: 2.5rem;
}
@media (min-width: 900px) { .compare { grid-template-columns: repeat(3, 1fr); } }
.option { padding: 1.4rem 1.35rem 1.2rem; border-top: 1px solid var(--line); }
.option:first-child { border-top: 0; }
@media (min-width: 900px) {
  .option { border-top: 0; border-left: 1px solid var(--line); }
  .option:first-child { border-left: 0; }
}
.option h3 { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; margin: 0 0 .5rem; }
.risk { display: flex; align-items: center; gap: .5rem; font-size: .95rem; color: var(--muted); margin-bottom: .75rem; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink); }
.dots i.on { background: var(--ink); }
.not-possible { color: var(--danger-text); font-weight: 700; margin: 0 0 .75rem; }
.figures { margin: 0 0 1.1rem; }
.figures div { display: flex; justify-content: space-between; gap: 1rem; padding: .45rem 0; border-bottom: 1px dashed var(--line); }
.figures dt { color: var(--muted); }
.figures dd { margin: 0; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.runway { margin: .25rem 0 1rem; }
.runway-label { display: flex; justify-content: space-between; font-size: .95rem; margin-bottom: .4rem; }
.runway-label strong { font-variant-numeric: tabular-nums; }
.runway-track { position: relative; height: 12px; border-radius: 6px; background: var(--mist); border: 1px solid var(--line); }
.runway-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--dusk); }
.runway-target { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--glow); }
.runway-note { font-size: .85rem; color: var(--muted); margin-top: .35rem; }
.flags { list-style: none; padding: 0; margin: 0 0 .75rem; display: flex; flex-wrap: wrap; gap: .4rem; }
.flags li { font-size: .85rem; border: 1px solid var(--line); border-radius: 999px; padding: .15rem .6rem; color: var(--muted); }
details.steps summary { cursor: pointer; color: var(--dusk); font-weight: 700; font-size: .95rem; }
details.steps ol { padding-left: 1.2rem; margin: .75rem 0 0; font-size: .9rem; }
details.steps li { margin-bottom: .65rem; }
details.steps .formula { color: var(--muted); display: block; }
details.steps .result { font-weight: 700; }

.plain { background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 1.5rem 1.4rem; margin-bottom: 2.5rem; }
.plain-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: .5rem 1rem; margin-bottom: 1rem; }
.plain-head .section-title { margin: 0; }
.tag { font-size: .88rem; color: var(--muted); }
.verified { display: inline-flex; align-items: center; gap: .35rem; font-size: .88rem; background: var(--dusk-soft); color: var(--ink); border-radius: 999px; padding: .2rem .7rem; }
.plain-item { padding: 1rem 0; border-top: 1px solid var(--line); max-width: 46em; }
.plain-item h4 { margin: 0 0 .35rem; font-size: 1.05rem; }
.plain-item p { margin: 0 0 .4rem; }
.plain-item .main-risk { color: var(--muted); }
.unverified { color: var(--muted); margin: 0; }

.reflect { display: grid; gap: 1.25rem; margin-bottom: 2.5rem; }
@media (min-width: 900px) { .reflect { grid-template-columns: 1.2fr 1fr; } }
.questions ol { margin: 0; padding-left: 1.25rem; }
.questions li { margin-bottom: .75rem; max-width: 40em; }
.money-card { background: var(--glow-soft); border-radius: 22px; padding: 1.4rem; }
.money-card h3 { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; margin: 0 0 .6rem; }
.money-card p { margin: 0 0 .6rem; }
.money-card p:last-child { margin: 0; }

.foot { border-top: 1px solid var(--line); padding-top: 1.25rem; color: var(--muted); font-size: .92rem; }
.foot ul { padding-left: 1.2rem; margin: .5rem 0 0; }

/* ---------- intro view ---------- */
.intro-hero { padding: 3rem 0 2.5rem; max-width: 760px; }
.intro-hero h1 {
  font-family: var(--font-display); font-weight: 700; letter-spacing: -.03em;
  font-size: clamp(2.6rem, 9vw, 5rem); line-height: .98; margin: 0 0 1.25rem;
}
.intro-hero p { font-size: 1.2rem; color: var(--muted); margin: 0 0 1.75rem; max-width: 32em; }
.scenes { display: grid; gap: 1.25rem; margin-bottom: 3rem; }
@media (min-width: 760px) { .scenes { grid-template-columns: 1fr 1fr; } }
.scene { margin: 0; }
.scene svg { display: block; width: 100%; height: auto; border-radius: 22px; }
.scene figcaption { padding: .9rem .25rem 0; }
.scene figcaption strong { display: block; font-family: var(--font-display); font-size: 1.2rem; margin-bottom: .2rem; }
.scene figcaption span { color: var(--muted); }
.fact {
  border-left: 4px solid var(--glow); padding: .25rem 0 .25rem 1.1rem; margin: 0 0 3rem; max-width: 44em;
}
.fact p { margin: 0 0 .35rem; font-size: 1.1rem; }
.fact small { color: var(--muted); }
.how { margin-bottom: 3rem; }
.how ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 1rem; counter-reset: how; }
@media (min-width: 760px) { .how ol { grid-template-columns: repeat(3, 1fr); } }
.how li { counter-increment: how; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 1.2rem; }
.how li::before {
  content: counter(how); display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%;
  background: var(--dusk); color: var(--paper); font-weight: 700; margin-bottom: .6rem;
}
.how li strong { display: block; margin-bottom: .2rem; }
.how li span { color: var(--muted); }
.promises { display: grid; gap: 1.5rem; margin-bottom: 3rem; }
@media (min-width: 760px) { .promises { grid-template-columns: repeat(3, 1fr); } }
.promise strong { display: block; font-family: var(--font-display); font-size: 1.15rem; margin-bottom: .3rem; }
.promise span { color: var(--muted); }
.intro-cta { background: var(--dusk-deep); color: #FAFAFC; border-radius: 26px; padding: 2rem 1.5rem; text-align: left; }
.intro-cta h2 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.6rem, 4.5vw, 2.4rem); line-height: 1.1; margin: 0 0 .6rem; }
.intro-cta p { margin: 0 0 1.4rem; opacity: .85; max-width: 34em; }
.intro-cta .btn-primary { background: var(--glow); color: #232838; }
/* illustration colours */
.ill-bg { fill: var(--paper); stroke: var(--line); }
.ill-night { fill: var(--dusk-deep); }
.ill-ink { fill: var(--ink); }
.ill-muted { fill: var(--muted); }
.ill-line { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.ill-soft { fill: var(--dusk-soft); }
.ill-dusk { fill: var(--dusk); }
.ill-glow { fill: var(--glow); }
.ill-glowsoft { fill: var(--glow-soft); }
.ill-white { fill: #FAFAFC; }
.ill-text { font-family: var(--font-body); font-weight: 700; }

[hidden] { display: none !important; }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#" id="home-link" aria-label="PauseBeforeBuy">
    <span class="brand-mark" aria-hidden="true"><span><i></i><i></i></span></span>
    <span class="brand-name">PauseBeforeBuy</span>
  </a>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="zh" aria-pressed="false">中文</button>
  </div>
</header>

<main>
  <!-- ================= INTRO ================= -->
  <section id="intro-view">
    <div class="intro-hero">
      <h1 data-i18n="introTitle"></h1>
      <p data-i18n="introText"></p>
      <button type="button" class="btn btn-primary" data-start data-i18n="introStart"></button>
    </div>

    <div class="scenes">
      <figure class="scene">
        <svg viewBox="0 0 320 210" role="img" aria-labelledby="s1t">
          <title id="s1t" data-i18n="scene1Alt"></title>
          <rect class="ill-night" width="320" height="210" rx="22"/>
          <circle class="ill-glow" cx="262" cy="48" r="22"/><circle class="ill-night" cx="272" cy="40" r="20"/>
          <circle class="ill-white" cx="60" cy="34" r="2"/><circle class="ill-white" cx="110" cy="58" r="1.5"/><circle class="ill-white" cx="205" cy="26" r="2"/><circle class="ill-white" cx="30" cy="92" r="1.5"/>
          <rect class="ill-glowsoft" x="118" y="44" width="92" height="150" rx="14"/>
          <rect class="ill-bg" x="126" y="58" width="76" height="92" rx="6"/>
          <rect class="ill-soft" x="134" y="66" width="60" height="40" rx="4"/>
          <path class="ill-line" d="M150 94 l10 -14 l10 10 l8 -8 l8 12" />
          <rect class="ill-muted" x="134" y="114" width="44" height="5" rx="2.5"/>
          <rect class="ill-muted" x="134" y="124" width="30" height="5" rx="2.5"/>
          <rect class="ill-dusk" x="126" y="158" width="76" height="24" rx="12"/>
          <text class="ill-text ill-white" x="164" y="174" font-size="11" text-anchor="middle" data-i18n="s1Button"></text>
          <text class="ill-text ill-glow" x="30" y="190" font-size="13">1:07</text>
        </svg>
        <figcaption><strong data-i18n="scene1Title"></strong><span data-i18n="scene1Text"></span></figcaption>
      </figure>

      <figure class="scene">
        <svg viewBox="0 0 320 210" role="img" aria-labelledby="s2t">
          <title id="s2t" data-i18n="scene2Alt"></title>
          <rect class="ill-bg" width="320" height="210" rx="22"/>
          <g transform="rotate(-6 160 105)">
            <path class="ill-glowsoft" d="M70 55 h150 l30 50 l-30 50 h-150 z"/>
            <circle class="ill-bg" cx="222" cy="105" r="8"/>
            <text class="ill-text ill-ink" x="88" y="100" font-size="30" data-i18n="s2Big"></text>
            <text class="ill-text ill-muted" x="90" y="124" font-size="12" data-i18n="s2Small"></text>
          </g>
          <rect class="ill-soft" x="40" y="168" width="240" height="4" rx="2"/>
          <rect class="ill-soft" x="40" y="178" width="200" height="4" rx="2"/>
          <rect class="ill-soft" x="40" y="188" width="220" height="4" rx="2"/>
        </svg>
        <figcaption><strong data-i18n="scene2Title"></strong><span data-i18n="scene2Text"></span></figcaption>
      </figure>

      <figure class="scene">
        <svg viewBox="0 0 320 210" role="img" aria-labelledby="s3t">
          <title id="s3t" data-i18n="scene3Alt"></title>
          <rect class="ill-bg" width="320" height="210" rx="22"/>
          <path class="ill-line" d="M40 178 h250" />
          <g>
            <rect class="ill-dusk" x="52" y="150" width="30" height="26" rx="4"/>
            <rect class="ill-dusk" x="94" y="150" width="30" height="26" rx="4"/><rect class="ill-glow" x="94" y="120" width="30" height="28" rx="4"/>
            <rect class="ill-dusk" x="136" y="150" width="30" height="26" rx="4"/><rect class="ill-glow" x="136" y="120" width="30" height="28" rx="4"/><rect class="ill-muted" x="136" y="92" width="30" height="26" rx="4"/>
            <rect class="ill-dusk" x="178" y="150" width="30" height="26" rx="4"/><rect class="ill-glow" x="178" y="120" width="30" height="28" rx="4"/><rect class="ill-muted" x="178" y="92" width="30" height="26" rx="4"/><rect class="ill-soft" x="178" y="62" width="30" height="28" rx="4"/>

  let ok = true;
  const price = num("price"), months = num("months"), up = num("upfront"), rate = num("rate");
  if (price === null) { setError("price", t().errRequired); ok = false; }
  else if (!(price > 0)) { setError("price", t().errPositive); ok = false; } else setError("price", "");
  if (months === null || !Number.isInteger(months) || months < 1 || months > 60) { setError("months", t().errMonths); ok = false; } else setError("months", "");
  if (up !== null && !(up >= 0)) { setError("upfront", t().errNonNeg); ok = false; } else setError("upfront", "");
  if (feeType() !== "none") {
    if (rate === null) { setError("rate", t().errRequired); ok = false; }
    else if (!(rate > 0)) { setError("rate", t().errRate); ok = false; } else setError("rate", "");
  } else setError("rate", "");
  return ok;
}
function validateStep2() {
  let ok = true;
  const income = num("income");
  if (income === null) { setError("income", t().errRequired); ok = false; }
  else if (!(income > 0)) { setError("income", t().errPositive); ok = false; } else setError("income", "");
  for (const id of ["savings", "essentials"]) {
    const v = num(id);
    if (v === null) { setError(id, t().errRequired); ok = false; }
    else if (!(v >= 0)) { setError(id, t().errNonNeg); ok = false; } else setError(id, "");
  }
  const debt = num("debt");
  if (debt !== null && !(debt >= 0)) { setError("debt", t().errNonNeg); ok = false; } else setError("debt", "");
  for (const id of ["target", "dti"]) {
    const v = num(id);
    if (v === null || !(v > 0)) { setError(id, t().errPositive); ok = false; $(id).closest("details").open = true; } else setError(id, "");
  }
  if (!ok) { const bad = document.querySelector("#step2 [aria-invalid=true]"); if (bad) bad.focus(); }
  return ok;
}

function buildRequest() {
  const ft = feeType(), rate = num("rate") || 0;
  return {
    profile: {
      monthly_income: num("income"), cash_savings: num("savings"),
      essential_expenses: num("essentials"), existing_debt_payments: num("debt") || 0
    },
    purchase: {
      item_name: $("item").value.trim().slice(0, 40),
      price: num("price"), instalment_months: num("months"),
      monthly_fee_rate: ft === "flat" ? rate / 100 : 0,      // unit conversion only: 0.6% -> 0.006
      annual_interest_rate: ft === "apr" ? rate / 100 : 0,   // 12% -> 0.12
      upfront_fee: num("upfront") || 0
    },
    settings: { emergency_target_months: num("target"), max_debt_to_income: num("dti") / 100, currency: "SGD" },
    language: apiLang()
  };
}

/* ---------------- saving the user's own numbers on this device ---------------- */
function saveFinances() {
  store.set("finances", { income: $("income").value, savings: $("savings").value, essentials: $("essentials").value,
    debt: $("debt").value, target: $("target").value, dti: $("dti").value });
}
function loadFinances() {
  const f = store.get("finances"); if (!f) return;
  for (const k of ["income", "savings", "essentials", "debt", "target", "dti"]) if (f[k] != null && f[k] !== "") $(k).value = f[k];
}

/* ---------------- API ---------------- */
let lastRequest = null;
async function callApi(req) {
  if (!API_BASE_URL) return { data: DEMO[req.language], demo: "noBackend" };
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 75000);   // free hosting can take up to a minute to wake up
  try {
    const res = await fetch(API_BASE_URL.replace(/\/$/, "") + "/simulate", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(req), signal: ctrl.signal
    });
    const data = await res.json();
    if (data && data.calc) return { data, demo: null };
    if (data && data.detail) return { apiError: data.detail };
    return { data: DEMO[req.language], demo: "failed" };
  } catch (e) {
    return { data: DEMO[req.language], demo: "failed" };
  } finally { clearTimeout(timer); }
}

const ERROR_FIELDS = [
  ["monthly_income", "income"], ["cash_savings", "savings"], ["essential_expenses", "essentials"],
  ["existing_debt_payments", "debt"], ["instalment_months", "months"], ["price", "price"],
  ["fee", "rate"], ["interest", "rate"]
];
function showApiErrors(errors) {
  let firstStep = 2;
  for (const msg of errors) {
    const hit = ERROR_FIELDS.find(([key]) => msg.toLowerCase().includes(key));
    if (hit) { setError(hit[1], msg); if (["months", "price", "rate", "upfront"].includes(hit[1])) firstStep = 1; }
    else $("err-form").textContent = msg;
  }
  goStep(firstStep);
}

/* ---------------- flow ---------------- */
function goStep(n) {
  step = n;
  $("step1").hidden = n !== 1;
  $("step2").hidden = n !== 2;
  updateProgress();
  const first = n === 1 ? $("item") : $("income");
  first.focus({ preventScroll: true });
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function runPause(promise) {
  const pause = $("pause");
  pause.classList.add("show");
  $("pause-status").textContent = "";
  $("skip").focus();
  let skipped = false;
  const skip = new Promise(res => { $("skip").onclick = () => { skipped = true; res(); }; });
  const wait = new Promise(res => setTimeout(res, PAUSE_MS));
  const tick = setTimeout(() => { $("pause-status").textContent = t().pauseWait; }, PAUSE_MS);
  await Promise.race([wait, skip]);
  if (skipped) $("pause-status").textContent = t().pauseWait;
  const waking = setTimeout(() => { $("pause-status").textContent = t().pauseWaking; }, 12000);
  const result = await promise;
  clearTimeout(tick); clearTimeout(waking);
  pause.classList.remove("show");
  return result;
}

async function submit() {
  clearErrors();
  if (!validateStep1()) { goStep(1); return; }
  if (!validateStep2()) return;
  saveFinances();
  lastRequest = buildRequest();
  const result = await runPause(callApi(lastRequest));
  handleResult(result);
}

function handleResult(result) {
  if (result.apiError) { $("err-form").textContent = typeof result.apiError === "string" ? result.apiError : t().errNetwork; return; }
  const { data, demo } = result;
  if (data.calc && data.calc.ok === false) { showApiErrors(data.calc.errors || []); return; }
  lastResponse = data; lastIsDemo = demo;
  render(data, demo);
}

async function refetchForLanguage() {
  if (!lastRequest) return;
  lastRequest.language = apiLang();
  $("headline").textContent = t().pauseWait;
  const result = await callApi(lastRequest);
  handleResult(result);
}

/* ---------------- rendering ---------------- */
function render(data, demo) {
  const L = t(), calc = data.calc, o = calc.options, inst = o.instalment;
  showView("results");

  const banner = $("demo-banner");
  banner.hidden = !demo;
  if (demo) banner.textContent = demo === "failed" ? L.demoFailed : L.demoNoBackend;

  const exp = data.explanation;
  const verified = data.checks && data.checks.ok && exp;
  $("headline").textContent = verified ? exp.overview : "";
  $("headline").hidden = !verified;
  $("baseline").textContent = L.baseline(money(calc.baseline.monthly_surplus), monthsText(calc.baseline.emergency_runway_months));

  renderReveal(calc, inst);
  renderCompare(calc);
  renderPlain(data, verified);

  const qs = $("questions"); qs.replaceChildren();
  (verified ? exp.questions_to_ask_yourself : []).forEach(q => qs.append(el("li", { text: q })));
  qs.closest(".questions").hidden = !verified;

  const card = $("money-card");
  card.hidden = !(inst.cost_of_credit > 0);
  if (!card.hidden) card.replaceChildren(
    el("h3", { text: L.moneyTitle }), el("p", { text: L.moneyText(money(inst.cost_of_credit)) }), el("p", { text: L.moneyText2 })
  );

  const as = $("assumptions"); as.replaceChildren();
  (calc.assumptions || []).forEach(a => as.append(el("li", { text: lang === "zh" ? (ASSUMPTION_ZH[a] || a) : a })));

  window.scrollTo({ top: 0 });
  (verified ? $("headline") : $("baseline")).focus?.({ preventScroll: true });
}

function renderReveal(calc, inst) {
  const L = t(), box = $("reveal"), inp = calc.inputs;
  box.hidden = !(inst.cost_of_credit > 0);
  if (box.hidden) return;
  let seenBig, seenUnit;
  if (inp.monthly_fee_rate > 0) { seenBig = pctInput(inp.monthly_fee_rate); seenUnit = L.perInstalment; }
  else if (inp.annual_interest_rate > 0) { seenBig = pctInput(inp.annual_interest_rate); seenUnit = L.perYear; }
  else { seenBig = "0%"; seenUnit = inp.upfront_fee > 0 ? L.plusFee(money(inp.upfront_fee)) : L.zeroRate; }
  const fee = inst.monthly_fee_amount > 0 ? money(inst.monthly_fee_amount) : null;
  box.replaceChildren(
    el("div", { class: "reveal-side seen" }, el("p", { class: "cap", text: L.seenCap }), el("p", { class: "big", text: seenBig }), el("p", { class: "unit", text: seenUnit })),
    el("div", { class: "reveal-side real" }, el("p", { class: "cap", text: L.realCap }), el("p", { class: "big", text: pctFromDecimal(inst.effective_annual_rate) }), el("p", { class: "unit", text: L.effRate })),
    el("p", { class: "reveal-foot", text: L.revealFoot(money(inst.cost_of_credit), inst.instalment_months, fee) })
  );
}

function figure(dt, dd) { return el("div", {}, el("dt", { text: dt }), el("dd", { text: dd })); }

function runwayBar(value, target, scaleMax) {
  const L = t();
  const w = value == null ? 100 : Math.min(value / scaleMax, 1) * 100;   // display scaling only
  const pos = Math.min(target / scaleMax, 1) * 100;
  const track = el("div", { class: "runway-track", role: "img", "aria-label": `${L.runwayLabel} ${monthsText(value)}` },
    el("div", { class: "runway-fill", style: `width:${w}%` }), el("div", { class: "runway-target", style: `left:calc(${pos}% - 1px)` }));
  return el("div", { class: "runway" },
    el("div", { class: "runway-label" }, el("span", { text: L.runwayLabel }), el("strong", { text: monthsText(value) })),
    track, el("div", { class: "runway-note", text: L.runwayTarget(trim(target)) }));
}

function renderCompare(calc) {
  const L = t(), o = calc.options, target = calc.settings.emergency_target_months;
  const runways = Object.values(o).map(x => x.emergency_runway_months).filter(v => v != null);
  const scaleMax = Math.min(Math.max(target * 2, ...runways), target * 4);
  const box = $("compare"); box.replaceChildren();
  for (const key of ["pay_in_full", "instalment", "delay"]) {
    const x = o[key];
    const level = x.risk_level;
    const dots = el("span", { class: "dots", "aria-hidden": "true" },
      ...[1, 2, 3].map(i => el("i", { class: i <= ({ low: 1, medium: 2, high: 3 }[level]) ? "on" : "" })));
    const figs = el("dl", { class: "figures" });
    if (key === "pay_in_full") {
      figs.append(figure(L.f.totalPaid, money(x.total_paid)), figure(L.f.extra, money(x.cost_of_credit)),
        figure(L.f.savingsAfter, money(x.savings_after_purchase)), figure(L.f.surplus, money(x.monthly_surplus_after)));
    } else if (key === "instalment") {
      figs.append(figure(L.f.monthlyPay, `${money(x.monthly_payment)} × ${x.instalment_months}`));
      if (x.monthly_fee_amount > 0) figs.append(figure(L.f.feePart, money(x.monthly_fee_amount)));
      figs.append(figure(L.f.totalPaid, money(x.total_paid)), figure(L.f.extra, money(x.cost_of_credit)),
        figure(L.f.surplusDuring, money(x.monthly_surplus_after)), figure(L.f.dti, pctFromDecimal(x.debt_to_income, 1)));
    } else {
      figs.append(figure(L.f.monthsToSave, x.months_to_save == null ? L.f.notReachable : L.months(x.months_to_save)),
        figure(L.f.savePerMonth, money(x.monthly_saving_capacity)), figure(L.f.totalPaid, money(x.total_paid)),
        figure(L.f.savingsAfter, money(x.savings_after_purchase)));
    }
    const flags = el("ul", { class: "flags", "aria-label": "Risk flags" },
      ...(x.risk_flags || []).map(f => el("li", { text: L.flags[f] || f })));
    const steps = calc.steps.filter(s => s.option === key);
    const stepList = el("ol", {}, ...steps.map(s => el("li", {},
      el("strong", { text: lang === "zh" ? (STEP_ZH[s.label] || s.label) : s.label }),
      el("span", { class: "formula", text: s.formula }),
      el("span", { class: "formula", text: s.substitution }),
      el("span", { class: "result", text: "= " + (lang === "zh" ? s.result.replace(/ months?$/, " 个月") : s.result) }))));
    box.append(el("article", { class: "option", "aria-labelledby": "h-" + key },
      el("h3", { id: "h-" + key, text: L.opt[key] }),
      el("div", { class: "risk" }, dots, el("span", { text: L.risk[level] })),
      x.feasible ? null : el("p", { class: "not-possible", text: L.notPossible[key] }),
      figs,
      runwayBar(x.emergency_runway_months, target, scaleMax),
      (x.risk_flags || []).length ? flags : null,
      el("details", { class: "steps" }, el("summary", { text: L.stepsSummary }), stepList)
    ));
  }
}

function renderPlain(data, verified) {
  const L = t(), box = $("plain");
  const head = el("div", { class: "plain-head" },
    el("h2", { class: "section-title", text: L.plainTitle }),
    el("span", { class: "tag", text: L.aiTag }));
  if (!verified) { box.replaceChildren(head, el("p", { class: "unverified", text: L.unverified })); return; }
  head.append(el("span", { class: "verified" }, el("span", { "aria-hidden": "true", text: "✓" }), L.verified));
  const items = data.explanation.options.map(x => el("div", { class: "plain-item" },
    el("h4", { text: L.opt[x.option] || x.option }), el("p", { text: x.plain_explanation }), el("p", { class: "main-risk", text: x.main_risk })));
  box.replaceChildren(head, ...items);
}

/* ---------------- views ---------------- */
function showView(name) {
  for (const v of ["intro", "form", "results"]) $(v + "-view").hidden = v !== name;
  window.scrollTo({ top: 0 });
}

/* ---------------- sample & wiring ---------------- */
function fillSample() {
  $("item").value = SAMPLE.item[lang]; $("price").value = SAMPLE.price; $("months").value = SAMPLE.months;
  document.querySelector(`input[name=feeType][value=${SAMPLE.feeType}]`).checked = true; updateRateField();
  $("rate").value = SAMPLE.rate; $("upfront").value = "";
  $("income").value = SAMPLE.income; $("savings").value = SAMPLE.savings; $("essentials").value = SAMPLE.essentials; $("debt").value = SAMPLE.debt;
  clearErrors();
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; store.set("lang", lang); applyLang();
}));
document.querySelectorAll("input[name=feeType]").forEach(r => r.addEventListener("change", updateRateField));
$("to-step2").addEventListener("click", () => { if (validateStep1()) goStep(2); });
$("back").addEventListener("click", () => goStep(1));
$("sample").addEventListener("click", fillSample);
$("submit-btn").addEventListener("click", submit);
/* Enter moves forward: next step on step 1, compare on step 2 */
$("form").addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.target.tagName !== "INPUT" || e.target.type === "radio") return;
  e.preventDefault();
  if (step === 1) $("to-step2").click(); else submit();
});
$("edit").addEventListener("click", () => { showView("form"); goStep(1); });
$("home-link").addEventListener("click", e => { e.preventDefault(); showView("intro"); });
document.querySelectorAll("[data-start]").forEach(b => b.addEventListener("click", () => { showView("form"); goStep(1); }));
$("clear-data").addEventListener("click", () => {
  store.del("finances");
  for (const k of ["income", "savings", "essentials", "debt"]) $(k).value = "";
  $("target").value = 3; $("dti").value = 35;
  $("err-form").textContent = t().cleared;
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("pause").classList.contains("show")) $("skip").click(); });

lang = store.get("lang") || ((navigator.language || "").startsWith("zh") ? "zh" : "en");
loadFinances();
applyLang();
</script>
